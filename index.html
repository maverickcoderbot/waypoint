<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#123a2b" />
  <title>Waypoint — free trail finder</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <!-- Leaflet from CDN (open source map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Immersive landing hero (dismisses into the map) -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <svg class="hero-ridge" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#0f3627" fill-opacity="0.9" d="M0,224 L120,208 L280,256 L440,176 L620,240 L820,160 L1020,232 L1220,184 L1440,240 L1440,320 L0,320 Z"/>
      <path fill="#0a2419" d="M0,272 L200,240 L400,288 L640,232 L880,288 L1120,248 L1340,296 L1440,272 L1440,320 L0,320 Z"/>
    </svg>

    <div class="hero-nav">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3l6.5 11.5H5.5L12 3z" fill="#c7f24e"/><path d="M8.2 14.5l3.8-6.7 3.8 6.7" stroke="#0f2417" stroke-width="1.4" fill="none"/></svg>
        Waypoint
      </div>
      <button class="hero-skip" id="heroSkip">Explore the map</button>
    </div>

    <div class="hero-body">
      <h1>Find your next <em>trail</em></h1>
      <p class="tag">Real hiking trails around you, live GPS on the path, and free forever.</p>
      <form class="hero-cta" id="heroForm">
        <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <input class="fld" id="heroInput" type="search" enterkeyhint="search" autocomplete="postal-code"
               placeholder="Zip code or place name" aria-label="Search by zip code or place name" />
        <button class="go" type="submit">Find trails</button>
      </form>
      <div class="hero-alt">
        <button id="heroLocate" type="button">Use my location</button>
        <button id="heroBrowse" type="button">Browse the map</button>
      </div>
    </div>
  </section>

  <!-- Floating top bar -->
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3l6.5 11.5H5.5L12 3z" fill="#2b7a3f"/><path d="M8.2 14.5l3.8-6.7 3.8 6.7" stroke="#fff" stroke-width="1.4" fill="none"/></svg>
      Waypoint
    </div>
    <div class="wx" id="wx" hidden></div>
  </header>

  <!-- Locate button -->
  <button id="locate" class="fab locate" title="Find my location" aria-label="Find my location">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0-6a1 1 0 011 1v1.06A8 8 0 0118.94 11H20a1 1 0 110 2h-1.06A8 8 0 0113 18.94V20a1 1 0 11-2 0v-1.06A8 8 0 015.06 13H4a1 1 0 110-2h1.06A8 8 0 0111 5.06V4a1 1 0 011-1z" fill="currentColor"/></svg>
  </button>

  <!-- Bottom sheet: trail list / detail -->
  <section class="sheet" id="sheet" data-state="peek">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-head">
      <form class="searchbar" id="placeForm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="placeInput" type="search" enterkeyhint="search" placeholder="Search a zip code or place" aria-label="Search a zip code or place" />
        <button type="submit">Go</button>
      </form>
      <button id="findBtn" class="primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0-6a1 1 0 011 1v1.06A8 8 0 0118.94 11H20a1 1 0 110 2h-1.06A8 8 0 0113 18.94V20a1 1 0 11-2 0v-1.06A8 8 0 015.06 13H4a1 1 0 110-2h1.06A8 8 0 0111 5.06V4a1 1 0 011-1z" fill="currentColor"/></svg>Find trails near here</button>
      <div class="status" id="status">Search a place above, or tap the crosshair to use your location.</div>
    </div>
    <div class="list" id="list"></div>

    <!-- Trail detail (hidden until a trail is picked) -->
    <div class="detail" id="detail" hidden>
      <button class="back" id="backBtn">← All trails</button>
      <h2 id="dName">Trail</h2>
      <div class="stats" id="dStats"></div>
      <div class="ontrail" id="onTrail" hidden></div>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./js/overpass.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
